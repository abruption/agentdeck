name: 버그 제보 / Bug report
description: 동작하지 않거나 이상한 점을 알려주세요 / Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? / What happened?
      description: 기대한 동작과 실제 동작 / Expected vs. actual
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법 / Steps to reproduce
      placeholder: "1. 4페이지에서 ... 2. ..."
  - type: input
    id: env
    attributes:
      label: 환경 / Environment
      placeholder: "macOS 15.x, Apple Silicon, Python 3.12, agent_source=hooks"
  - type: textarea
    id: log
    attributes:
      label: dashboard.log (개인 정보는 지워주세요 / redact personal info)
      render: text
